name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The ARCore/SceneView native libraries fill the runner's disk while
      # packaging; drop preinstalled toolchains this build never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift && df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Optional: sign with the shared key so updates install over old APKs.
      # Secrets: MFP_KEYSTORE_BASE64, MFP_KEYSTORE_PASSWORD, MFP_KEY_ALIAS, MFP_KEY_PASSWORD.
      - name: Load shared signing key
        env:
          KEYSTORE_B64: ${{ secrets.MFP_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mfp.jks"
          {
            echo "MFP_KEYSTORE_PATH=$RUNNER_TEMP/mfp.jks"
            echo "MFP_KEYSTORE_PASSWORD=${{ secrets.MFP_KEYSTORE_PASSWORD }}"
            echo "MFP_KEY_ALIAS=${{ secrets.MFP_KEY_ALIAS }}"
            echo "MFP_KEY_PASSWORD=${{ secrets.MFP_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Rename APK for Release
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/MyFuturePet.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyFuturePet-debug-apk
          path: build/app/outputs/flutter-apk/MyFuturePet.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/MyFuturePet.apk
          name: My Future Pet ${{ github.ref_name }}
          body: |
            Debug APK for My Future Pet (BSIT Capstone, Jagna Animal Lover and Rescue Group)
            - Real floor AR inside the app on ARCore phones: finds the floor, anchors the pet where you tap, real size
            - Placement only on a settled floor within 4 m, tracking tips (too dark / too fast), live distance readout
            - Pet faces you, casts a shadow, floor dots hide after placing; AR snapshot shares a photo
            - Sensor-based floor preview with approximate size on phones without ARCore
            - Life-size 3D pet models; static (no animation) models hide the Sit and Wag Tail buttons
          draft: false
          prerelease: false
